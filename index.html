<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant | Powered by n8n</title>
  <meta name="description" content="A powerful AI assistant chatbot powered by n8n workflows and OpenRouter AI models." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">AI Assistant</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" title="New conversation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-search">
      <div class="search-input-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
          <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search conversations..." />
      </div>
    </div>

    <div class="sidebar-section">
      <span class="section-label">Recent</span>
      <div class="chat-history" id="chatHistory">
        <!-- History items injected by JS -->
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">S</div>
        <div class="user-info">
          <span class="user-name">Student</span>
          <span class="user-plan">Free Plan</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v.01M12 12v.01M12 19v.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main Content -->
  <main class="main" id="main">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" title="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="model-selector">
        <div class="model-badge">
          <div class="model-dot"></div>
          <span>AI Assistant</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="exportChatBtn" title="Export conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="clearChatBtn" title="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg id="sunIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg id="moonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <div class="chat-container" id="chatContainer">
      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-glow"></div>
        <div class="welcome-content">
          <div class="welcome-logo">
            <div class="pulse-ring"></div>
            <div class="pulse-ring delay-1"></div>
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="welcome-title">How can I help you today?</h1>
          <p class="welcome-subtitle">I'm your AI assistant powered by n8n. Ask me anything!</p>
          <div class="suggestion-grid">
            <button class="suggestion-card" data-prompt="What services does ICICI Bank offer?">
              <div class="suggestion-icon">🏦</div>
              <div class="suggestion-text">
                <span class="suggestion-title">Banking Services</span>
                <span class="suggestion-desc">What services does ICICI Bank offer?</span>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="How do I open a new bank account?">
              <div class="suggestion-icon">📋</div>
              <div class="suggestion-text">
                <span class="suggestion-title">Account Opening</span>
                <span class="suggestion-desc">How do I open a new bank account?</span>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="Tell me about credit card benefits and rewards">
              <div class="suggestion-icon">💳</div>
              <div class="suggestion-text">
                <span class="suggestion-title">Credit Cards</span>
                <span class="suggestion-desc">Tell me about credit card benefits and rewards</span>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="What are the home loan interest rates?">
              <div class="suggestion-icon">🏠</div>
              <div class="suggestion-text">
                <span class="suggestion-title">Home Loans</span>
                <span class="suggestion-desc">What are the home loan interest rates?</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-area" id="messagesArea" style="display:none;">
        <!-- Messages rendered by JS -->
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-section">
      <div class="input-wrapper" id="inputWrapper">
        <div class="input-box">
          <textarea
            id="userInput"
            placeholder="Message AI Assistant..."
            rows="1"
            maxlength="4000"
          ></textarea>
          <div class="input-actions">
            <span class="char-count" id="charCount"></span>
            <button class="mic-btn" id="micBtn" title="Voice input (Speech to Text)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="2"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="send-btn" id="sendBtn" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="input-hint">AI can make mistakes. Verify important information.</p>
      </div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
